[env:pico]
; Usa o repositório oficial atualizado que suporta o core earlephilhower no RP2040
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Velocidade do Monitor Série
monitor_speed = 9600

; HABILITA O FREERTOS NATIVO NO RP2040
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS

; Baixa automaticamente todas as bibliotecas dos sensores do projeto
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14